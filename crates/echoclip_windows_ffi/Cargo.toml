[package]
name = "echoclip_windows_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
echoclip_core = { path = "../echoclip_core" }
echoclip_sync_client = { path = "../echoclip_sync_client" }
echoclip_sync_protocol = { path = "../echoclip_sync_protocol" }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.18.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry"] }
