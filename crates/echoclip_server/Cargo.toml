[package]
name = "echoclip_server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
echoclip_core = { path = "../echoclip_core" }
echoclip_sync_protocol = { path = "../echoclip_sync_protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
ipnet = { version = "2", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"

[[bin]]
name = "echoclip"
path = "src/main.rs"
