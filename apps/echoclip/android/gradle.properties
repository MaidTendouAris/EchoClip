org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 当前 Flutter Gradle Plugin 仍会读取 AGP legacy extension。
# 完全切到 new DSL 会在 FlutterPluginUtils.getLegacyAndroidExtension 处触发 NPE。
android.newDsl=false
# 当前 Flutter/AGP 组合的 built-in Kotlin 自动迁移路径仍会提示 KGP classpath 问题。
# 先保留旧开关，等待 Flutter Gradle Plugin 完整支持后再迁移。
android.builtInKotlin=false
# The project and Flutter pub cache may live on different Windows drives.
# Kotlin's relocatable incremental cache cannot represent those paths.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
